[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ktt112026"
version = "0.1.0"
description = "Modular Discord voice, Vietnamese TTS and music foundation"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "discord.py[voice]>=2.7.1,<3.0",
  "audioop-lts>=0.2.2; python_version >= '3.13'",
  "yt-dlp>=2024.8.0",
  "PyNaCl>=1.5.0,<1.6.0",
  "davey>=0.1.0",
  "edge-tts>=6.1.0",
  "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ktt112026 = "ktt112026.bot:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
