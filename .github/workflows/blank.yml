name: KTT112026 - ZIP Update

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Tên ZIP trong repo itsk4to/File-Update"
        required: true
        type: string
        default: "KTT112026_NEW.zip"

permissions:
  contents: write

concurrency:
  group: ktt112026-zip-update
  cancel-in-progress: false

jobs:
  update:
    name: Validate, Test and Push KTT112026
    runs-on: ubuntu-latest

    steps:
      # 1. Giữ nguyên cách checkout của workflow cũ.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Chỉ đổi quy tắc tên ZIP và project version cho KTT112026.
      - name: Validate ZIP filename
        id: zip
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail

          if [[ "$ZIP_NAME" == "KTT112026_NEW.zip" ]]; then
            VERSION="0.1.0"
          elif [[ "$ZIP_NAME" =~ ^KTT112026_V([0-9]+\.[0-9]+\.[0-9]+)(_[A-Za-z0-9.-]+)?\.zip$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Tên ZIP không hợp lệ: $ZIP_NAME"
            echo "Dùng KTT112026_NEW.zip hoặc KTT112026_V0.1.0.zip"
            exit 1
          fi
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ZIP: $ZIP_NAME"
          echo "Version: $VERSION"

      # 3. Tải ZIP từ đúng kho File-Update như workflow cũ.
      - name: Download update ZIP
        shell: bash
        env:
          ZIP_NAME: ${{ steps.zip.outputs.name }}
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/itsk4to/File-Update/main/${ZIP_NAME}"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$URL" --output "$RUNNER_TEMP/ktt112026-update.zip"
          test -s "$RUNNER_TEMP/ktt112026-update.zip"
          ls -lh "$RUNNER_TEMP/ktt112026-update.zip"

      # 4. Kiểm tra ZIP trước khi giải nén.
      - name: Validate ZIP archive
        run: unzip -t "$RUNNER_TEMP/ktt112026-update.zip"

      # 5. Dùng lại cơ chế giải nén an toàn + overlay của workflow cũ.
      #    Chỉ thay thư mục đích và tên thư mục bọc được nhận diện.
      - name: Extract update safely
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import stat
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "ktt112026-update.zip"
          destination = Path("KTT112026")
          temp = Path(os.environ["RUNNER_TEMP"]) / "ktt112026-extract"

          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir(parents=True)
          destination.mkdir(parents=True, exist_ok=True)

          blocked_dirs = {
              ".git", ".github", ".venv", "venv", "__pycache__",
              ".pytest_cache", ".mypy_cache", ".ruff_cache", "node_modules"
          }
          blocked_suffixes = {".db", ".sqlite", ".sqlite3"}

          def is_protected(parts):
              for part in parts:
                  lower = part.lower()
                  if lower in blocked_dirs or lower == ".env":
                      return True
                  if lower.startswith(".env.") and lower != ".env.example":
                      return True
              filename = parts[-1].lower() if parts else ""
              return Path(filename).suffix.lower() in blocked_suffixes

          with zipfile.ZipFile(archive) as z:
              files = []
              for info in z.infolist():
                  raw = info.filename.replace("\\", "/")
                  path = PurePosixPath(raw)
                  if path.is_absolute() or not path.parts:
                      raise RuntimeError(f"Path không an toàn: {raw}")
                  if ".." in path.parts or ":" in path.parts[0]:
                      raise RuntimeError(f"Path traversal: {raw}")
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise RuntimeError(f"Không chấp nhận symlink: {raw}")
                  if not info.is_dir():
                      files.append((info, path.parts))

              if not files:
                  raise RuntimeError("ZIP không chứa file nào.")
              if sum(info.file_size for info, _ in files) > 200 * 1024 * 1024:
                  raise RuntimeError("ZIP vượt giới hạn giải nén 200 MB.")

              first_parts = {parts[0] for _, parts in files}
              strip_root = None
              if len(first_parts) == 1:
                  candidate = next(iter(first_parts))
                  if re.match(r"^KTT112026([-_].*)?$", candidate, re.IGNORECASE):
                      strip_root = candidate

              selected = {}
              for info, parts in files:
                  relative = parts
                  if strip_root and relative[0].lower() == strip_root.lower():
                      relative = relative[1:]
                  if relative and relative[0].lower() == "ktt112026":
                      priority = 2
                      relative = relative[1:]
                  else:
                      priority = 1
                  if not relative:
                      continue
                  if is_protected(relative):
                      print(f"SKIP protected: {info.filename}")
                      continue
                  normalized = PurePosixPath(*relative).as_posix()
                  previous = selected.get(normalized)
                  if previous is not None:
                      old_priority, _ = previous
                      if priority == old_priority:
                          raise RuntimeError(f"ZIP trùng file cùng mức ưu tiên: {normalized}")
                      if priority < old_priority:
                          print(f"SKIP duplicate: {info.filename}")
                          continue
                      print(f"Ưu tiên file project: {info.filename}")
                  selected[normalized] = (priority, info)

              if not selected:
                  raise RuntimeError("Không có file hợp lệ để cập nhật.")

              for normalized, (_, info) in selected.items():
                  target = temp / Path(*PurePosixPath(normalized).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output)

          # Kiểm tra cấu trúc ZIP trước khi ghi vào repo.
          required = [
              "pyproject.toml", "requirements.txt", "requirements-dev.txt",
              "README.md", "src/ktt112026/__init__.py",
              "src/ktt112026/bot.py", "src/ktt112026/config.py",
              "src/ktt112026/features/voice/presence.py",
              "src/ktt112026/features/voice/tts/service.py",
              "src/ktt112026/features/voice/music/player.py",
              "src/ktt112026/features/voice/music/manager.py",
              "src/ktt112026/features/voice/audio/ffmpeg.py",
              "src/ktt112026/platform/discord_app/voice_commands.py",
          ]
          missing = [name for name in required if not (temp / name).is_file()]
          if missing:
              raise RuntimeError("ZIP thiếu file bắt buộc: " + ", ".join(missing))

          copied = 0
          for source in temp.rglob("*"):
              if not source.is_file():
                  continue
              target = destination / source.relative_to(temp)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              copied += 1
          print(f"Đã kiểm tra cấu trúc và overlay {copied} file vào {destination}/")
          PY

      # 6. Xác minh version trong pyproject.toml và cấu trúc package.
      - name: Verify project version
        working-directory: KTT112026
        env:
          EXPECTED_VERSION: ${{ steps.zip.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              project = tomllib.load(file)["project"]
          actual = str(project["version"])
          expected = os.environ["EXPECTED_VERSION"]
          print(f"Expected version: {expected}")
          print(f"Project version:  {actual}")
          if actual != expected:
              raise SystemExit("Version trong tên ZIP không khớp pyproject.toml")
          PY

      # 7. Cài đúng cả dependency kiểm thử; workflow cũ không có bước test này.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        working-directory: KTT112026
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m pip show pytest
          python -m pip show pytest-asyncio

      # 8. Chạy unit tests trước khi cho phép commit.
      - name: Run unit tests
        working-directory: KTT112026
        run: python -m pytest tests/unit -v

      # 9. Stage riêng KTT112026; không chạm kato-tutien/ của bản cũ.
      - name: Stage source update
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- KTT112026

          python - <<'PY'
          import subprocess
          import sys
          from pathlib import PurePosixPath

          result = subprocess.run(
              ["git", "diff", "--cached", "--name-only"],
              check=True, capture_output=True, text=True
          )
          files = [line.strip() for line in result.stdout.splitlines() if line.strip()]
          forbidden_suffixes = (".db", ".sqlite", ".sqlite3")

          for filename in files:
              path = PurePosixPath(filename)
              basename = path.name.lower()
              if not filename.startswith("KTT112026/"):
                  sys.exit(f"File ngoài project: {filename}")
              if basename == ".env":
                  sys.exit(f"Từ chối commit .env: {filename}")
              if basename.startswith(".env.") and basename != ".env.example":
                  sys.exit(f"Từ chối commit file môi trường: {filename}")
              if basename.endswith(forbidden_suffixes):
                  sys.exit(f"Từ chối commit database: {filename}")
          print(f"Đã kiểm tra {len(files)} file staged.")
          PY

      # 10. Commit và push theo cách của workflow cũ.
      - name: Commit and push to main
        shell: bash
        env:
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Không có thay đổi mới."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update KTT112026 v${VERSION}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "Đã push KTT112026 v${VERSION} lên main."
